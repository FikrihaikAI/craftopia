services:
  mysql:
    image: mysql:8.0
    container_name: baggeddebug-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: baggedebug_db
      MYSQL_USER: baggedebug
      MYSQL_PASSWORD: baggedebug123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: baggedebug-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: baggedebug
      PMA_PASSWORD: baggedebug123
    depends_on:
      - mysql

  backend:
    build: ./backend
    container_name: baggeddebug-backend
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads 

  frontend:
    build: ./frontend
    container_name: baggedebug-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env

volumes:
  mysql_data: